name: Post Reels

on:
  schedule:
    # Slots are 8:00 AM, 12:30 PM and 7:00 PM Eastern (13:00, 17:30, 00:00 UTC in winter).
    # A few tries per slot because GitHub drops some scheduled runs; the script only posts what is due,
    # never twice, and never more than 6 hours late. Fewer runs also keeps us inside the free Actions minutes.
    - cron: "3,23,43 13 * * *"
    - cron: "33,53 17 * * *"
    - cron: "13,43 18 * * *"
    - cron: "3,23,43 0 * * *"
    - cron: "13,43 1 * * *"
    # catch-up tries later in each window
    - cron: "17 15 * * *"
    - cron: "17 20 * * *"
    - cron: "17 3 * * *"
    # temporary: check that scheduled runs fire (nothing is due, so these post nothing)
    - cron: "10,25,40,55 20 * * *"
    - cron: "10,25,40 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check token and audio, post nothing)"
        type: boolean
        default: true
      no_publish:
        description: "Upload test (upload and process, never publish)"
        type: boolean
        default: false
      explore_audio:
        description: "Only list the music library (posts nothing)"
        type: boolean
        default: false
      force_n:
        description: "Post this calendar number now (leave blank for the schedule)"
        required: false

concurrency:
  group: post-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Explore audio
        if: github.event_name == 'workflow_dispatch' && inputs.explore_audio
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python tools/explore_audio.py
      - name: Post due Reel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.explore_audio) }}
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.no_publish && '1' || '0' }}
          FORCE_N: ${{ github.event_name == 'workflow_dispatch' && inputs.force_n || '' }}
        run: python post_reel.py
      - name: Record what was posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "cleffy-bot"
            git config user.email "cleffy-bot@users.noreply.github.com"
            git add state
            git commit -m "Record posted Reel"
            git push
          fi
