name: Post Reels

on:
  # Timed posting moved to heartbeat.yml (GitHub skipped most scheduled runs). This one is for manual runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check token and audio, post nothing)"
        type: boolean
        default: true
      no_publish:
        description: "Upload test (upload and process, never publish)"
        type: boolean
        default: false
      explore_audio:
        description: "Only list the music library (posts nothing)"
        type: boolean
        default: false
      force_n:
        description: "Post this calendar number now (leave blank for the schedule)"
        required: false

concurrency:
  group: post-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Explore audio
        if: github.event_name == 'workflow_dispatch' && inputs.explore_audio
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python tools/explore_audio.py
      - name: Post due Reel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.explore_audio) }}
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.no_publish && '1' || '0' }}
          FORCE_N: ${{ github.event_name == 'workflow_dispatch' && inputs.force_n || '' }}
        run: python post_reel.py
      - name: Record what was posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "cleffy-bot"
            git config user.email "cleffy-bot@users.noreply.github.com"
            git add state
            git commit -m "Record posted Reel"
            git push
          fi
