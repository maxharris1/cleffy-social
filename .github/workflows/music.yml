name: Music

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "search = list recordings on Wikimedia Commons; build = put the picks from music.json into reels/ and commit"
        type: choice
        options: [search, build, check, covertest]
        default: search
      only:
        description: "build only these post numbers (space separated; blank = all in music.json)"
        required: false

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Search
        if: inputs.mode == 'search'
        run: python tools/commons_music.py search ${{ inputs.only }}
      - name: Build
        if: inputs.mode == 'build'
        run: python tools/commons_music.py build ${{ inputs.only }}
      - name: Check published Reels have sound
        if: inputs.mode == 'check'
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python tools/check_audio.py ${{ inputs.only || '8' }}
      - name: Test cover hosting
        if: inputs.mode == 'covertest'
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python tools/cover_host.py covers/${{ inputs.only }}
      - name: Commit reels
        if: always() && inputs.mode == 'build'
        run: |
          if [ -n "$(git status --porcelain reels)" ]; then
            git config user.name "cleffy-bot"
            git config user.email "cleffy-bot@users.noreply.github.com"
            git add reels
            git commit -m "Put recordings into Reels"
            for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 10; done
          fi
